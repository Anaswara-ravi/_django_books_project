{% extends 'base.html' %}

{% block title %}home | bookshelf{% endblock %}

{% block contents %}
<main class="container">
    <section class="hero">
        <div class="hero-content">
            <h1>welcome Bookshelf 📚</h1>
            <p>a small collection of books to browse</p>
            <a href="{% url 'book_list' %}" class="browse-btn">browse all books →</a>
        </div>
        <div class="hero-image">
            <div class="book book-one"></div>
            <div class="book book-two"></div>
            <div class="book book-three"></div>
        </div>
    </section>

    <section class="featured">
        <h2>featured book</h2>
        <div class="book-grid">
            {% for book in featured %}
                <article class="book-card">
                    <div class="book-cover">📖</div>
                    <h3>{{ book.title }}</h3>
                    <p>{{ book.author }}</p>
                    <a href="{% url 'book_detail' book.id %}">View details</a>
                </article>
            {% endfor %}
        </div>
    </section>
</main>
{% endblock %}
